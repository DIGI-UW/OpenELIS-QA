# Run the QA suite against a real `develop` build.
#
# WHY THIS EXISTS
# Every run of this suite used to target either testing.openelis-global.org or
# a local stack pinned to release 3.2.2.0. Neither is `develop` — so when
# clients reported bugs on develop the suite was structurally incapable of
# seeing them, and it produced confident false negatives (the ward field reads
# as missing on 3.2.2.0 and is present on develop).
#
# WHY IT DOES NOT USE A SELF-HOSTED RUNNER
# The obvious way to reach a develop stack is a self-hosted runner on a machine
# running one. This repository is PUBLIC, and on a public repo a self-hosted
# runner is a standing invitation: fork pull requests can execute code on that
# machine, and runners are not ephemeral by default. Instead this job builds
# the stack INSIDE the GitHub-hosted runner and throws it away with the job.
#
# It fits: the five develop images total ~4.5 GB against 14 GB of runner disk,
# and the running stack uses ~3.4 GB against 16 GB of RAM (both measured).
#
# COST: nothing. Standard runners are free for public repositories.

name: develop-stack

on:
  # Approximates "on every merge to develop" without needing a cross-repo PAT:
  # poll, and skip immediately when the SHA has not moved. A run only happens
  # when develop actually changed.
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if develop has not moved since the last run'
        type: boolean
        default: false
      suite:
        description: 'all = every suite in ci-suites.json; docs = the on-demand media capture tier'
        type: choice
        options: [all, docs]
        default: all

concurrency:
  # A stack boot is ~15-25 minutes; overlapping runs would fight for the
  # runner's ports and prove nothing.
  group: develop-stack
  cancel-in-progress: false

jobs:
  test-against-develop:
    name: shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Was 90, and run 34656118535 was CANCELLED at it with modules.config.ts alone still
    # running after 79 minutes. A cancelled run produces no verdict at all, which is the one
    # outcome worse than a red one. Each shard now carries a slice, so this is headroom
    # rather than an expectation.
    timeout-minutes: 180
    strategy:
      # Every shard must report. Stopping the others because one went red would throw away
      # exactly the information the run exists to collect.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      APP_REPO: DIGI-UW/OpenELIS-Global-2
      BASE: https://localhost:10443
      BASE_URL: https://localhost:10443
      # modules.config.ts makes the argument for this and the nightly already sets it:
      # "retries exist to absorb flake; in a suite that has never run, the failures are not
      # flake -- they are the point. Retrying them doubles the cost of every failure for no
      # information." This workflow was the one place still paying that cost, on the suite
      # least likely to be green.
      PW_RETRIES: 0
      # The chains' declared-gap register only means anything in strict mode.
      GAPS_STRICT: '1'

    steps:
      - uses: actions/checkout@v4

      - name: What is develop's HEAD?
        id: head
        run: |
          SHA=$(gh api "repos/$APP_REPO/commits/develop" --jq '.sha')
          SUBJ=$(gh api "repos/$APP_REPO/commits/develop" --jq '.commit.message' | head -1)
          echo "sha=$SHA"        >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:8}" >> "$GITHUB_OUTPUT"
          echo "### develop \`${SHA:0:8}\` — $SUBJ" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}

      # The cache is the "have we already tested this commit" record. A cache
      # hit means the SHA is unchanged since the last successful run.
      - name: Have we already tested this commit?
        id: seen
        uses: actions/cache@v4
        with:
          path: .last-tested-sha
          key: develop-tested-${{ steps.head.outputs.sha }}

      - name: Skip if develop has not moved
        if: steps.seen.outputs.cache-hit == 'true' && inputs.force != true
        run: |
          echo "develop is still ${{ steps.head.outputs.short }}, already tested. Nothing to do." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # ---- everything below only runs when develop actually moved ----

      # Node and the browser go in BEFORE the stack boot on purpose. The stack
      # takes ~14 minutes to come up; a toolchain problem should surface in
      # forty seconds, not after that wait. The first four runs of this
      # workflow failed here and threw away a healthy stack every time.
      - uses: actions/setup-node@v4
        if: steps.seen.outputs.cache-hit != 'true' || inputs.force == true
        with:
          node-version: '22'
          # NO `cache: npm`, and NO `npm ci` below. package-lock.json is
          # gitignored in this repo (.gitignore:8), and both of those require
          # it — setup-node exits 1 with "Dependencies lock file is not found".
          # nightly.yml carries the same note; keep the two in step.

      - name: Install
        if: steps.seen.outputs.cache-hit != 'true' || inputs.force == true
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Check out the app at develop
        if: steps.seen.outputs.cache-hit != 'true' || inputs.force == true
        uses: actions/checkout@v4
        with:
          repository: DIGI-UW/OpenELIS-Global-2
          ref: ${{ steps.head.outputs.sha }}
          path: app
          fetch-depth: 1

      - name: Bring up the develop stack
        if: steps.seen.outputs.cache-hit != 'true' || inputs.force == true
        run: |
          set -euo pipefail
          # These two are not in the repo and the compose file mounts them.
          mkdir -p app/volume/plugins app/volume/lucene
          cp environments/develop-local/docker-compose.develop.yml app/
          cd app
          docker compose -p oedevqa -f docker-compose.develop.yml pull --quiet
          docker compose -p oedevqa -f docker-compose.develop.yml up -d
          docker compose -p oedevqa -f docker-compose.develop.yml ps

      - name: Record the image digest
        if: steps.seen.outputs.cache-hit != 'true' || inputs.force == true
        run: |
          # `:develop` moves. A result without its digest is not reproducible.
          D=$(docker inspect openelisglobal-webapp-dev --format '{{index .RepoDigests 0}}' || echo unknown)
          echo "image: \`$D\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$D" > image-digest.txt

      - name: Wait for the stack to be healthy
        if: steps.seen.outputs.cache-hit != 'true' || inputs.force == true
        run: |
          set -uo pipefail
          # A cold boot reseeds the whole config catalog — ~14 min measured on
          # an M-series Mac, and a GitHub runner has fewer cores. The compose
          # healthcheck carries a 900s start_period for the same reason.
          for i in $(seq 1 100); do
            H=$(docker inspect openelisglobal-webapp-dev --format '{{.State.Health.Status}}' 2>/dev/null || echo none)
            C=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 "$BASE/" || true)
            echo "[$i] health=$H http=$C"
            if [ "$H" = "healthy" ] && [ "$C" = "200" ]; then
              echo "up after ~$((i*20))s"; exit 0
            fi
            if [ "$H" = "unhealthy" ]; then
              echo "::error::webapp reported unhealthy"; break
            fi
            sleep 20
          done
          echo "::error::stack did not come up in time"
          docker compose -p oedevqa -f app/docker-compose.develop.yml logs --tail 60 oe.openelis.org || true
          exit 1

      # The stack bind-mounts ./volume/lucene and ./volume/plugins, and the
      # container writes them as root, so `app/volume/lucene/Patient` lands in
      # the workspace owned by root and mode 700. all-tc.config.ts and
      # modules.config.ts both use `testDir: '.'`, so Playwright walks the whole
      # repo to collect specs, reaches that directory and dies before running a
      # single test:
      #
      #   Error: EACCES: permission denied, scandir
      #   '/home/runner/work/OpenELIS-QA/OpenELIS-QA/app/volume/lucene/Patient'
      #
      # Making the tree traversable is enough; nothing needs to write to it.
      - name: Let the runner traverse the stack's bind mounts
        if: steps.seen.outputs.cache-hit != 'true' || inputs.force == true
        run: sudo chmod -R a+rX app/volume || true

      - name: Authenticate
        if: steps.seen.outputs.cache-hit != 'true' || inputs.force == true
        run: npx playwright test -c all-tc.config.ts --project=setup --reporter=line

      # WHAT THIS RUN COVERS
      # Everything. ci-suites.json is the source of truth: it lists the configs CI runs
      # and, for anything deliberately left out, the reason. scripts/check-ci-coverage.mjs
      # asks Playwright which files each listed config actually resolves and fails if any
      # spec in the tree is run by nobody and has no recorded reason.
      #
      # That check exists because "is it reachable by some config" and "does anything
      # actually run it" are different questions, and only the first one had a gate.
      # On 2026-09-12 the orphan gate was passing cleanly while this workflow ran 2 of 40
      # configs: 69 of 227 spec files. The rest were owned, green in the orphan map, and
      # executed by no one on any schedule.
      - name: Check every spec is claimed by a suite CI runs
        if: steps.seen.outputs.cache-hit != 'true' || inputs.force == true
        run: node scripts/check-ci-coverage.mjs

      # One step, every suite, so adding a config to ci-suites.json is the only edit
      # needed to get it running here. Each suite's output is kept separately so the
      # summary and the verdict can speak about them one at a time.
      #
      # Failures do not stop the loop: one broken suite must not cost us the results of
      # the other twenty-seven. The outcome is re-asserted in Verdict below, after
      # everything is recorded and uploaded.
      - name: Run the suites
        id: suites
        if: steps.seen.outputs.cache-hit != 'true' || inputs.force == true
        run: |
          set -uo pipefail
          mkdir -p out
          sudo chmod -R a+rX app/volume || true

          WANT="${{ inputs.suite || 'all' }}"
          SHARD="${{ matrix.shard }}"
          if [ "$WANT" = "docs" ]; then
            # The docs tier is one config and is not sharded; only shard 1 runs it.
            if [ "$SHARD" != "1" ]; then
              echo "docs tier runs on shard 1 only; nothing to do here."
              exit 0
            fi
            LIST=$(jq -r '.docsSuite.config' ci-suites.json)
          else
            LIST=$(jq -r --argjson s "$SHARD" '.suites[] | select(.shard == $s) | .config' ci-suites.json)
          fi
          echo "shard $SHARD runs: $(echo $LIST | tr '\n' ' ')" 

          for cfg in $LIST; do
            name="${cfg%.config.ts}"
            echo "::group::$name"
            allow_zero=$(jq -r --arg c "$cfg" '(.suites[] | select(.config==$c) | .allowZero) // false' ci-suites.json)
            env_pairs=$(jq -r --arg c "$cfg" '(.suites[] | select(.config==$c) | .env // {}) | to_entries[] | "\(.key)=\(.value)"' ci-suites.json)
            # shellcheck disable=SC2086
            env $env_pairs npx playwright test -c "$cfg" --reporter=line 2>&1 | tee "out/$name.txt"
            code=${PIPESTATUS[0]}
            printf '%s\n' "$code" > "out/$name.exit"
            printf '%s\n' "$allow_zero" > "out/$name.allowzero"
            echo "$name exit=$code"
            echo "::endgroup::"
          done

      - name: Summarise
        if: always() && (steps.seen.outputs.cache-hit != 'true' || inputs.force == true)
        run: |
          # Report the COUNTS, not only an exit code. An exit code cannot distinguish
          # "everything passed" from "nothing ran", and that is the exact confusion that
          # made eight nightlies green for nothing.
          {
            echo "### develop \`${{ steps.head.outputs.short }}\` — shard ${{ matrix.shard }}"
            echo
            echo "| suite | exit | passed | failed | flaky | did not run |"
            echo "| --- | ---: | ---: | ---: | ---: | ---: |"
            for f in out/*.txt; do
              [ -f "$f" ] || continue
              n=$(basename "$f" .txt)
              t=$(tail -5 "$f")
              p=$(echo "$t" | grep -oE '[0-9]+ passed'      | grep -oE '[0-9]+' | head -1); p=${p:-0}
              x=$(echo "$t" | grep -oE '[0-9]+ failed'      | grep -oE '[0-9]+' | head -1); x=${x:-0}
              k=$(echo "$t" | grep -oE '[0-9]+ flaky'       | grep -oE '[0-9]+' | head -1); k=${k:-0}
              d=$(echo "$t" | grep -oE '[0-9]+ did not run' | grep -oE '[0-9]+' | head -1); d=${d:-0}
              e=$(cat "out/$n.exit" 2>/dev/null || echo '?')
              echo "| $n | $e | $p | $x | $k | $d |"
            done
            echo
            for f in out/*.txt; do
              [ -f "$f" ] || continue
              echo "<details><summary>$(basename "$f" .txt)</summary>"
              echo; echo '```'; tail -40 "$f"; echo '```'
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always() && (steps.seen.outputs.cache-hit != 'true' || inputs.force == true)
        uses: actions/upload-artifact@v4
        with:
          name: develop-${{ steps.head.outputs.short }}-${{ github.run_number }}-shard${{ matrix.shard }}
          path: |
            out/
            image-digest.txt
            playwright-report/
            test-results/
            regression-results/
          retention-days: 14
          if-no-files-found: ignore

      # Written last and only on a completed run, so a boot failure is retried
      # on the next poll rather than being recorded as tested.
      #
      # Deliberately BEFORE the verdict gate below: a suite that ran and found
      # a real defect has done its job, and re-running that same commit every
      # three hours would only burn runner time. Only a run that never produced
      # a result gets retried.
      #
      # ONE SHARD WRITES IT. All four share the same cache key, so four writers would race
      # to store identical content for no benefit. Shard 1 is the writer: if it never got
      # far enough to run, nothing marks the commit and the next poll retries the lot,
      # which is the behaviour we want anyway.
      - name: Mark this commit tested
        if: matrix.shard == 1 && (steps.seen.outputs.cache-hit != 'true' || inputs.force == true)
        run: echo "${{ steps.head.outputs.sha }}" > .last-tested-sha

      # WHY THIS STEP EXISTS
      # The suite loop above deliberately swallows failures so that one broken suite does
      # not rob us of the others' results or of the uploaded artifacts. The cost of that is
      # a job which would otherwise report success no matter what the tests did, and a green
      # check nobody can act on is worse than no check at all: it is exactly how eight
      # consecutive nightlies were green by construction.
      #
      # So the outcome is re-asserted here, at the end, once results are safely recorded.
      #
      # It fails on two distinct conditions, and they are different faults:
      #   1. a suite FAILED          -> the product, or a spec, is broken
      #   2. a suite ran ZERO tests  -> the HARNESS is broken, and this is the silent one.
      #      Playwright collects nothing when a path or testMatch stops matching, prints a
      #      cheerful summary and can exit 0. A run that asserts nothing is never a pass.
      #      Setup-only configs declare "allowZero": true in ci-suites.json and are exempt.
      - name: Verdict
        if: always() && (steps.seen.outputs.cache-hit != 'true' || inputs.force == true)
        run: |
          set -uo pipefail
          bad=0
          ran=0
          for f in out/*.txt; do
            [ -f "$f" ] || continue
            n=$(basename "$f" .txt)
            ran=$((ran+1))
            code=$(cat "out/$n.exit" 2>/dev/null || echo 1)
            allow_zero=$(cat "out/$n.allowzero" 2>/dev/null || echo false)
            t=$(tail -5 "$f")
            passed=$(echo "$t" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' | head -1); passed=${passed:-0}
            failed=$(echo "$t" | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+' | head -1); failed=${failed:-0}

            if [ "$passed" -eq 0 ] && [ "$allow_zero" != "true" ]; then
              echo "::error::$n ran ZERO tests. A suite that asserts nothing is not a pass - check its testMatch and testDir before trusting any result from this run."
              bad=1
            fi
            if [ "$code" != "0" ] || [ "$failed" -gt 0 ]; then
              echo "::error::$n failed ($failed failing, exit=$code). See the job summary and the uploaded playwright-report."
              bad=1
            fi
            echo "$n: exit=$code passed=$passed failed=$failed"
          done

          if [ "$ran" -eq 0 ]; then
            echo "::error::shard ${{ matrix.shard }} produced no suite output at all"
            exit 1
          fi
          if [ "$bad" -ne 0 ]; then
            echo "::error::develop-stack shard ${{ matrix.shard }}: NOT GREEN on ${{ steps.head.outputs.short }} ($ran suites)"
            exit 1
          fi
          echo "develop-stack shard ${{ matrix.shard }}: green on ${{ steps.head.outputs.short }} ($ran suites)"

      - name: Tear down
        if: always()
        run: |
          docker compose -p oedevqa -f app/docker-compose.develop.yml down -v || true
