# Run the QA suite against a real `develop` build.
#
# WHY THIS EXISTS
# Every run of this suite used to target either testing.openelis-global.org or
# a local stack pinned to release 3.2.2.0. Neither is `develop` — so when
# clients reported bugs on develop the suite was structurally incapable of
# seeing them, and it produced confident false negatives (the ward field reads
# as missing on 3.2.2.0 and is present on develop).
#
# WHY IT DOES NOT USE A SELF-HOSTED RUNNER
# The obvious way to reach a develop stack is a self-hosted runner on a machine
# running one. This repository is PUBLIC, and on a public repo a self-hosted
# runner is a standing invitation: fork pull requests can execute code on that
# machine, and runners are not ephemeral by default. Instead this job builds
# the stack INSIDE the GitHub-hosted runner and throws it away with the job.
#
# It fits: the five develop images total ~4.5 GB against 14 GB of runner disk,
# and the running stack uses ~3.4 GB against 16 GB of RAM (both measured).
#
# COST: nothing. Standard runners are free for public repositories.

name: develop-stack

on:
  # Approximates "on every merge to develop" without needing a cross-repo PAT:
  # poll, and skip immediately when the SHA has not moved. A run only happens
  # when develop actually changed.
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even if develop has not moved since the last run'
        type: boolean
        default: false
      suite:
        description: 'Which suites to run'
        type: choice
        options: [core, chains, both]
        default: both

concurrency:
  # A stack boot is ~15-25 minutes; overlapping runs would fight for the
  # runner's ports and prove nothing.
  group: develop-stack
  cancel-in-progress: false

jobs:
  test-against-develop:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      APP_REPO: DIGI-UW/OpenELIS-Global-2
      BASE: https://localhost:10443
      BASE_URL: https://localhost:10443
      # The chains' declared-gap register only means anything in strict mode.
      GAPS_STRICT: '1'

    steps:
      - uses: actions/checkout@v4

      - name: What is develop's HEAD?
        id: head
        run: |
          SHA=$(gh api "repos/$APP_REPO/commits/develop" --jq '.sha')
          SUBJ=$(gh api "repos/$APP_REPO/commits/develop" --jq '.commit.message' | head -1)
          echo "sha=$SHA"        >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:8}" >> "$GITHUB_OUTPUT"
          echo "### develop \`${SHA:0:8}\` — $SUBJ" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}

      # The cache is the "have we already tested this commit" record. A cache
      # hit means the SHA is unchanged since the last successful run.
      - name: Have we already tested this commit?
        id: seen
        uses: actions/cache@v4
        with:
          path: .last-tested-sha
          key: develop-tested-${{ steps.head.outputs.sha }}

      - name: Skip if develop has not moved
        if: steps.seen.outputs.cache-hit == 'true' && inputs.force != true
        run: |
          echo "develop is still ${{ steps.head.outputs.short }}, already tested. Nothing to do." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # ---- everything below only runs when develop actually moved ----

      # Node and the browser go in BEFORE the stack boot on purpose. The stack
      # takes ~14 minutes to come up; a toolchain problem should surface in
      # forty seconds, not after that wait. The first four runs of this
      # workflow failed here and threw away a healthy stack every time.
      - uses: actions/setup-node@v4
        if: steps.seen.outputs.cache-hit != 'true' || inputs.force == true
        with:
          node-version: '22'
          # NO `cache: npm`, and NO `npm ci` below. package-lock.json is
          # gitignored in this repo (.gitignore:8), and both of those require
          # it — setup-node exits 1 with "Dependencies lock file is not found".
          # nightly.yml carries the same note; keep the two in step.

      - name: Install
        if: steps.seen.outputs.cache-hit != 'true' || inputs.force == true
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Check out the app at develop
        if: steps.seen.outputs.cache-hit != 'true' || inputs.force == true
        uses: actions/checkout@v4
        with:
          repository: DIGI-UW/OpenELIS-Global-2
          ref: ${{ steps.head.outputs.sha }}
          path: app
          fetch-depth: 1

      - name: Bring up the develop stack
        if: steps.seen.outputs.cache-hit != 'true' || inputs.force == true
        run: |
          set -euo pipefail
          # These two are not in the repo and the compose file mounts them.
          mkdir -p app/volume/plugins app/volume/lucene
          cp environments/develop-local/docker-compose.develop.yml app/
          cd app
          docker compose -p oedevqa -f docker-compose.develop.yml pull --quiet
          docker compose -p oedevqa -f docker-compose.develop.yml up -d
          docker compose -p oedevqa -f docker-compose.develop.yml ps

      - name: Record the image digest
        if: steps.seen.outputs.cache-hit != 'true' || inputs.force == true
        run: |
          # `:develop` moves. A result without its digest is not reproducible.
          D=$(docker inspect openelisglobal-webapp-dev --format '{{index .RepoDigests 0}}' || echo unknown)
          echo "image: \`$D\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$D" > image-digest.txt

      - name: Wait for the stack to be healthy
        if: steps.seen.outputs.cache-hit != 'true' || inputs.force == true
        run: |
          set -uo pipefail
          # A cold boot reseeds the whole config catalog — ~14 min measured on
          # an M-series Mac, and a GitHub runner has fewer cores. The compose
          # healthcheck carries a 900s start_period for the same reason.
          for i in $(seq 1 100); do
            H=$(docker inspect openelisglobal-webapp-dev --format '{{.State.Health.Status}}' 2>/dev/null || echo none)
            C=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 "$BASE/" || true)
            echo "[$i] health=$H http=$C"
            if [ "$H" = "healthy" ] && [ "$C" = "200" ]; then
              echo "up after ~$((i*20))s"; exit 0
            fi
            if [ "$H" = "unhealthy" ]; then
              echo "::error::webapp reported unhealthy"; break
            fi
            sleep 20
          done
          echo "::error::stack did not come up in time"
          docker compose -p oedevqa -f app/docker-compose.develop.yml logs --tail 60 oe.openelis.org || true
          exit 1

      # The stack bind-mounts ./volume/lucene and ./volume/plugins, and the
      # container writes them as root, so `app/volume/lucene/Patient` lands in
      # the workspace owned by root and mode 700. all-tc.config.ts and
      # modules.config.ts both use `testDir: '.'`, so Playwright walks the whole
      # repo to collect specs, reaches that directory and dies before running a
      # single test:
      #
      #   Error: EACCES: permission denied, scandir
      #   '/home/runner/work/OpenELIS-QA/OpenELIS-QA/app/volume/lucene/Patient'
      #
      # Making the tree traversable is enough; nothing needs to write to it.
      - name: Let the runner traverse the stack's bind mounts
        if: steps.seen.outputs.cache-hit != 'true' || inputs.force == true
        run: sudo chmod -R a+rX app/volume || true

      - name: Authenticate
        if: steps.seen.outputs.cache-hit != 'true' || inputs.force == true
        run: npx playwright test -c all-tc.config.ts --project=setup --reporter=line

      # WHAT THIS RUN ACTUALLY COVERS, so a green check is not read as more
      # than it is. modules.config.ts matches `tests/<name>.spec.ts` and nothing
      # else: specs at the repository ROOT (the whole test-catalog-* family) and
      # specs in `tests/` SUBDIRECTORIES other than the chains config below are
      # not collected here. "develop is green" therefore means the flat tests/
      # module suite and the regression chains passed, not the whole repository.
      # Widening this is a deliberate decision with a real wall-clock cost, not
      # an oversight -- but nobody should discover the boundary by assuming the
      # wrong one.
      - name: Core suites
        id: core
        if: (steps.seen.outputs.cache-hit != 'true' || inputs.force == true) && (inputs.suite != 'chains')
        continue-on-error: true
        run: |
          mkdir -p out
          sudo chmod -R a+rX app/volume || true
          npx playwright test -c modules.config.ts --reporter=line 2>&1 | tee out/core.txt
          exit ${PIPESTATUS[0]}

      - name: Regression chains (GAPS_STRICT=1)
        id: chains
        if: (steps.seen.outputs.cache-hit != 'true' || inputs.force == true) && (inputs.suite != 'core')
        continue-on-error: true
        run: |
          mkdir -p out
          sudo chmod -R a+rX app/volume || true
          npx playwright test -c regression-chains.config.ts --reporter=line 2>&1 | tee out/chains.txt
          exit ${PIPESTATUS[0]}

      - name: Summarise
        if: steps.seen.outputs.cache-hit != 'true' || inputs.force == true
        run: |
          # Report the COUNTS, not only the step outcome. A step outcome cannot
          # distinguish "everything passed" from "nothing ran", and that is the
          # exact confusion that made eight nightlies green for nothing.
          {
            echo "| suite | outcome | passed | failed | flaky | did not run |"
            echo "| --- | --- | ---: | ---: | ---: | ---: |"
            for f in core chains; do
              [ -f "out/$f.txt" ] || { echo "| $f | skipped | - | - | - | - |"; continue; }
              t=$(tail -5 "out/$f.txt")
              p=$(echo "$t" | grep -oE '[0-9]+ passed'     | grep -oE '[0-9]+' | head -1); p=${p:-0}
              x=$(echo "$t" | grep -oE '[0-9]+ failed'     | grep -oE '[0-9]+' | head -1); x=${x:-0}
              k=$(echo "$t" | grep -oE '[0-9]+ flaky'      | grep -oE '[0-9]+' | head -1); k=${k:-0}
              d=$(echo "$t" | grep -oE '[0-9]+ did not run'| grep -oE '[0-9]+' | head -1); d=${d:-0}
              case "$f" in
                core)   o="${{ steps.core.outcome || 'skipped' }}" ;;
                chains) o="${{ steps.chains.outcome || 'skipped' }}" ;;
              esac
              echo "| $f | $o | $p | $x | $k | $d |"
            done
            echo
            echo "develop \`${{ steps.head.outputs.short }}\`"
            echo
            for f in out/core.txt out/chains.txt; do
              [ -f "$f" ] || continue
              echo "<details><summary>$(basename "$f" .txt)</summary>"
              echo; echo '```'; tail -30 "$f"; echo '```'
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always() && (steps.seen.outputs.cache-hit != 'true' || inputs.force == true)
        uses: actions/upload-artifact@v4
        with:
          name: develop-${{ steps.head.outputs.short }}-${{ github.run_number }}
          path: |
            out/
            image-digest.txt
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      # Written last and only on a completed run, so a boot failure is retried
      # on the next poll rather than being recorded as tested.
      #
      # Deliberately BEFORE the verdict gate below: a suite that ran and found
      # a real defect has done its job, and re-running that same commit every
      # three hours would only burn runner time. Only a run that never produced
      # a result gets retried.
      - name: Mark this commit tested
        if: steps.seen.outputs.cache-hit != 'true' || inputs.force == true
        run: echo "${{ steps.head.outputs.sha }}" > .last-tested-sha

      # WHY THIS STEP EXISTS
      # Both suite steps carry continue-on-error, so that one failing suite does
      # not rob us of the other one's results or of the uploaded artifacts. The
      # cost of that is a job which reports success no matter what the tests did,
      # and a green check nobody can act on is worse than no check at all: it is
      # exactly how eight consecutive nightlies were green by construction.
      #
      # So the outcome is re-asserted here, at the end, once the results are
      # safely recorded and uploaded.
      #
      # It fails on two distinct conditions, and they are different faults:
      #   1. a suite FAILED           -> the product (or a spec) is broken
      #   2. a suite ran ZERO tests   -> the harness is broken, and this is the
      #      silent one. Playwright collects nothing when a path or testMatch
      #      stops matching, prints a cheerful summary and can exit 0. A run
      #      that asserts nothing must never be reported as a pass.
      - name: Verdict
        if: steps.seen.outputs.cache-hit != 'true' || inputs.force == true
        run: |
          set -uo pipefail
          bad=0
          for f in core chains; do
            case "$f" in
              core)   outcome="${{ steps.core.outcome || 'skipped' }}" ;;
              chains) outcome="${{ steps.chains.outcome || 'skipped' }}" ;;
            esac
            [ "$outcome" = "skipped" ] && { echo "$f: skipped by input"; continue; }

            if [ ! -f "out/$f.txt" ]; then
              echo "::error::$f produced no output at all"; bad=1; continue
            fi

            tail5=$(tail -5 "out/$f.txt")
            passed=$(echo "$tail5" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' | head -1)
            passed=${passed:-0}
            failed=$(echo "$tail5" | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+' | head -1)
            failed=${failed:-0}

            if [ "$passed" -eq 0 ]; then
              echo "::error::$f ran ZERO tests. A suite that asserts nothing is not a pass - check the config's testMatch and testDir before trusting any result from this run."
              bad=1
            fi
            if [ "$outcome" != "success" ] || [ "$failed" -gt 0 ]; then
              echo "::error::$f failed ($failed failing, outcome=$outcome). See the job summary and the uploaded playwright-report."
              bad=1
            fi
            echo "$f: outcome=$outcome passed=$passed failed=$failed"
          done
          if [ "$bad" -ne 0 ]; then
            echo "::error::develop-stack verdict: NOT GREEN on ${{ steps.head.outputs.short }}"
            exit 1
          fi
          echo "develop-stack verdict: green on ${{ steps.head.outputs.short }}"

      - name: Tear down
        if: always()
        run: |
          docker compose -p oedevqa -f app/docker-compose.develop.yml down -v || true
