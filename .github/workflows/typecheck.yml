name: typecheck

# Why this exists: three compile-level defects reached `main` in one week because
# nothing typechecked the repo — expect.fail() (not a Playwright API; it throws
# TypeError and masks the real assertion message) in chains E and H, and an
# un-annotated `let verdict` in the RBAC matrix that widened to `string` and
# stopped satisfying ProbeResult. All three were found by hand. One job catches
# the whole class.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # NB: `npm ci` is deliberately not used — package-lock.json is gitignored
      # in this repo, so there is no lockfile to install from.
      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      # BLOCKING: the committed .skill package must match its source. It is a
      # build artifact that gets INSTALLED into an account and is not read from
      # source at install time — twice on 2026-08-12 a PR edited SKILL.md /
      # references/ and the packaged copy silently kept the old content, so the
      # installed skill lagged the repo. Compares content hashes, not zip bytes.
      - name: Skill package is in sync with source
        run: npm run check:skill

      # BLOCKING: the maintained surface (RBAC axes, personas, chain H,
      # apiShapes, setups, configs). This is green today and must stay green.
      - name: Typecheck maintained surface
        run: npm run typecheck

      # BLOCKING: no NEW test may be added that asserts nothing. A test which
      # reaches its end without an assertion cannot fail, so it cannot report
      # anything — it just inflates the pass count. A repo scan on 2026-09-03
      # found 296 of these already present (and 36 tests that can print the
      # word "FAIL" and still pass), which is why this is a baseline gate
      # rather than a hard switch: the existing backlog is recorded in
      # .assert-baseline.json and can only shrink. Also blocks focused tests.
      - name: No new assertion-free tests
        run: npm run lint:assert

      # NON-BLOCKING: the rest of the repo. ~166 errors as of 2026-07-31,
      # mostly missing type imports in older specs. Reported so the number is
      # visible and can only go down; widen tsconfig.json's include as files
      # are fixed.
      - name: Measure whole-repo backlog (informational)
        continue-on-error: true
        run: |
          set +e
          npm run typecheck:all > /tmp/all.txt 2>&1
          COUNT=$(grep -c "error TS" /tmp/all.txt)
          echo "Whole-repo type errors: $COUNT"
          {
            echo "### Whole-repo typecheck backlog"
            echo ""
            echo "**$COUNT** errors outside the gated surface (non-blocking)."
            echo ""
            echo "Top offenders:"
            echo '```'
            grep -oE "^[a-zA-Z0-9_./-]+\.ts" /tmp/all.txt | sort | uniq -c | sort -rn | head -10
            echo '```'
            echo "By error code:"
            echo '```'
            grep -oE "error TS[0-9]+" /tmp/all.txt | sort | uniq -c | sort -rn | head -8
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
