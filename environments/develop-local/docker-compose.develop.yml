# ---------------------------------------------------------------------------
# RUN THIS FROM AN OpenELIS-Global-2 CHECKOUT, NOT FROM THIS DIRECTORY.
#
# The service definitions mount ./volume/... paths (database.env, nginx conf,
# properties, plugins, lucene) that exist in the application repo, not in the
# QA repo. `docker compose config` run from here fails with
# "env file .../environments/develop-local/volume/database/database.env not
# found" — that is this, not a broken file.
#
#   git clone --depth 1 --branch develop \
#     https://github.com/DIGI-UW/OpenELIS-Global-2.git ~/dev/oe-develop-qa
#   mkdir -p ~/dev/oe-develop-qa/volume/plugins ~/dev/oe-develop-qa/volume/lucene
#   cp environments/develop-local/docker-compose.develop.yml ~/dev/oe-develop-qa/
#   cd ~/dev/oe-develop-qa
#   docker compose -p oedevqa -f docker-compose.develop.yml up -d
#
# The copy here is the version of record, so the stack is reproducible from
# this repo rather than from one laptop. See ../README.md.
# ---------------------------------------------------------------------------
# OpenELIS Global DEVELOP — local QA target
#
# Generated 2026-09-10 from ../oe-322-qa/docker-compose.qa.yml, which pins
# 3.2.2.0. This one pins `:develop` on purpose.
#
# WHY BOTH EXIST. The QA suite was written and verified against the 3.2.2.0
# release images, but the client bug reports are coming from the develop
# branch. A suite that only ever runs against a three-week-old release build
# cannot see a develop regression. Running both means a failure can be
# attributed: red on develop and green on 3.2.2.0 is a new regression, red on
# both is an older bug the suite had not yet covered.
#
# `:develop` is a moving target by design. Record the image digest with the run
# if you need to reproduce a result:
#   docker inspect openelisglobal-webapp-dev --format '{{index .Image}}'
#
# Everything that could collide with the two stacks already running is moved —
# project name, container names, host ports, network subnet, and the named
# volumes (project-scoped, which is what keeps the 3.2.2.0 database intact):
#
#   distro stack    proxy 80/443       webapp 8080/8443    fhir 8081/8444    db 15432   subnet 172.20.1.0/24
#   3.2.2.0 stack   proxy 9080/9443    webapp 18080/18443  fhir 18081/18444  db 15433   subnet 172.21.1.0/24
#   develop stack   proxy 10080/10443  webapp 19080/19443  fhir 19081/19444  db 15434   subnet 172.22.1.0/24
#
# Bring it up with an explicit project name so the volumes stay separate:
#   docker compose -p oedevqa -f docker-compose.develop.yml up -d
#
# Reach it at https://localhost:10443 (through the nginx proxy — NOT
# https://localhost:19443, which is Tomcat direct and serves the legacy JSP app
# rather than the React front end).
#
# A cold first boot reseeds the whole config catalog (~836s measured on this
# host), which is why the webapp healthcheck carries a 900s start_period.
#
# CERTS (2026-10-26). Since OpenELIS-Global-2 #4792 (merged 25 Oct, develop
# c525598b) itechuw/certgen:main ships no key: the certs service has to run the
# app repo's scripts/certs/ensure-install-keys.sh, which makes the install's own
# key, keystore, truststore and proxy certificate, and every service that reads
# the stores waits for it to finish. This file still ran the old image's
# default, so no keystore was written, the webapp never came up and
# develop-stack runs 207 onward (25 Oct 08:21 UTC) ran no suite at all. The
# certs, webapp, fhir and proxy blocks below follow develop's
# docker-compose.yml. The passwords are unquoted: in list form the quotes were
# part of the value, which the script would have used as the store password.
#
# PROXY, ADMIN PASSWORD, DB PASSWORD (2026-11-09). develop-stack runs 218 to 266
# (27 Oct 12:25 UTC onward) ran no suite again. OpenELIS-Global-2 #4841 (27 Oct,
# d8bec2ba) made volume/nginx/nginx-prod.conf a template: its HTTP server now
# reads ${OE_HTTPS_PORT}, and develop's proxy renders it with envsubst at start.
# This file still mounted it straight onto /etc/nginx/nginx.conf, so nginx
# stopped with 'unknown "oe_https_port" variable', the proxy restarted forever
# and the health wait never saw a 200. Since then develop also moved to:
#   - the certs image itechuw/openelis-global-2-certs:develop, which carries
#     ensure-install-keys.sh as its entrypoint, and nocopy store volumes (the
#     new script refuses a proxy certificate without its stores, which is what
#     an image-populated certs volume looks like);
#   - no DEFAULT_PW: the webapp creates admin only from the
#     initial-admin-password secret and stops if it is missing (#4854). CI uses
#     the app repo's dev/initial-admin-password, the same test password as
#     before;
#   - database and store passwords passed as environment, not -D options.
# The certs, webapp, fhir and proxy blocks below follow develop's
# docker-compose.yml and build.docker-compose.yml again; QA keeps its own names,
# ports, subnet and healthcheck. Test credentials keep their old defaults.
services:
    certs:
        container_name: oe-certs-dev
        image: itechuw/openelis-global-2-certs:develop
        platform: linux/amd64
        restart: "no"
        # Gives the install its own TLS key on first start and keeps the stores built from it.
        # The image's entrypoint runs ensure-install-keys.sh.
        environment:
            - KEYSTORE_PW=${SSL_KEYSTORE_PASSWORD:-kspass}
            - TRUSTSTORE_PW=${SSL_TRUSTSTORE_PASSWORD:-tspass}
        networks:
            - default
        volumes:
            - type: volume
              source: key_trust-store-volume
              target: /etc/openelis-global
              volume:
                nocopy: true
            - type: volume
              source: keys-vol
              target: /etc/ssl/private/
              volume:
                nocopy: true
            - type: volume
              source: certs-vol
              target: /etc/ssl/certs/
              volume:
                nocopy: true

    db.openelis.org:
        container_name: openelisglobal-database-dev
        image: itechuw/openelis-global-2-database:develop
        platform: linux/amd64
        ports:
            - "15434:5432"
        restart: always
        env_file:
            - ./volume/database/database.env
        environment:
            - DB_PASSWORD=${OE_DB_PASSWORD:-clinlims}
            - DB_SUPERUSER_PASSWORD=${ADMIN_PASSWORD:-superuser}
        volumes:
            # Named volume, project-scoped, so this database is entirely
            # separate from the distro stack's bind-mounted one.
            - db-data:/var/lib/postgresql/data
        networks:
            - default
        healthcheck:
            test: [ "CMD", "pg_isready", "-q", "-d", "clinlims", "-U", "clinlims" ]
            timeout: 45s
            interval: 10s
            retries: 10

    oe.openelis.org:
        container_name: openelisglobal-webapp-dev
        image: itechuw/openelis-global-2:develop
        platform: linux/amd64
        depends_on:
            db.openelis.org:
                condition: service_started
            certs:
                condition: service_completed_successfully
        ports:
            - "19080:8080"
            - "19443:8443"
        restart: always
        networks:
            default:
                ipv4_address: 172.22.1.121
        healthcheck:
            # Tomcat serves the app only at /api/OpenELIS-Global since OpenELIS-Global-2
            # d1e2f943 (on develop 4 Nov with #4819; autoDeploy off), so the old
            # /OpenELIS-Global path answers 404 and the webapp could never turn healthy.
            test: ["CMD-SHELL", "curl -k -sf https://localhost:8443/api/OpenELIS-Global/health > /dev/null"]
            interval: 15s
            timeout: 15s
            retries: 10
            start_period: 900s
        environment:
            - TZ=${TZ:-UTC}
            - OE_DB_PASSWORD=${OE_DB_PASSWORD:-clinlims}
            - OE_ENCRYPTION_PASSWORD=${OE_ENCRYPTION_PASSWORD:-}
            - SSL_KEYSTORE_PASSWORD=${SSL_KEYSTORE_PASSWORD:-kspass}
            - SSL_TRUSTSTORE_PASSWORD=${SSL_TRUSTSTORE_PASSWORD:-tspass}
            - CATALINA_OPTS=-Ddatasource.url=jdbc:postgresql://db.openelis.org:5432/clinlims -Ddatasource.username=clinlims -Doe.ssl.truststorepath=${SSL_TRUSTSTORE_PATH:-/etc/openelis-global/truststore} -Doe.ssl.keystorepath=${SSL_KEYSTORE_PATH:-/etc/openelis-global/keystore}
        volumes:
            - type: volume
              source: key_trust-store-volume
              target: /etc/openelis-global
              volume:
                nocopy: true
            - ./volume/plugins/:/var/lib/openelis-global/plugins
            - ./volume/lucene:/var/lib/lucene_index
            - ./volume/analyzer/analyzer-test-map.csv:/var/lib/openelis-global/analyzer/analyzer-test-map.csv
            - ./volume/properties/SystemConfiguration.properties:/var/lib/openelis-global/properties/SystemConfiguration.properties
            - ./volume/odoo/odoo-test-product-mapping.csv:/var/lib/openelis-global/odoo/odoo-test-product-mapping.csv
            - ./volume/configuration:/var/lib/openelis-global/configuration
            - reporting-data:/var/lib/openelis-global/reporting
            - ./volume/translation:/var/lib/openelis-global/translation:ro
            - ./volume/modules:/var/lib/openelis-global/modules:ro
            - modules-data:/var/lib/openelis-global/modules-data
        secrets:
            # Used only when the database has no admin yet (a fresh CI stack).
            - source: initial-admin-password
            - source: common.properties

    fhir.openelis.org:
        container_name: external-fhir-api-dev
        image: itechuw/openelis-global-2-fhir:develop
        platform: linux/amd64
        depends_on:
            db.openelis.org:
                condition: service_started
            certs:
                condition: service_completed_successfully
        ports:
            - "19081:8080"
            - "19444:8443"
        networks:
            - default
        restart: always
        environment:
            TZ: ${TZ:-UTC}
            JAVA_OPTS: "-Djavax.net.ssl.trustStore=${SSL_TRUSTSTORE_PATH:-/etc/openelis-global/truststore}
                        -Djavax.net.ssl.trustStoreType=pkcs12
                        -Djavax.net.ssl.keyStore=${SSL_KEYSTORE_PATH:-/etc/openelis-global/keystore}
                        -Djavax.net.ssl.keyStoreType=pkcs12"
            CATALINA_OPTS: "-Dhapi.ssl.truststorepath=${SSL_TRUSTSTORE_PATH:-/etc/openelis-global/truststore} -Dhapi.ssl.keystorepath=${SSL_KEYSTORE_PATH:-/etc/openelis-global/keystore}"
            FHIR_DATASOURCE_URL: "jdbc:postgresql://db.openelis.org:5432/clinlims?currentSchema=clinlims"
            FHIR_DATASOURCE_USERNAME: "clinlims"
            SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:-kspass}
            SSL_TRUSTSTORE_PASSWORD: ${SSL_TRUSTSTORE_PASSWORD:-tspass}
            FHIR_DATASOURCE_PASSWORD: ${OE_DB_PASSWORD:-clinlims}
            FHIR_SERVER_ADRESS: "http://fhir.openelis.org:8080/fhir/"
        volumes:
            - type: volume
              source: key_trust-store-volume
              target: /etc/openelis-global
              volume:
                nocopy: true

    frontend.openelis.org:
        image: itechuw/openelis-global-2-frontend:develop
        container_name: openelisglobal-front-end-dev
        platform: linux/amd64
        networks:
            - default
        environment:
            - CHOKIDAR_USEPOLLING=true
        tty: true

    proxy:
        image: itechuw/openelis-global-2-proxy:develop
        container_name: openelisglobal-proxy-dev
        platform: linux/amd64
        ports:
            - 10080:80
            - 10443:443
        environment:
            # The HTTPS port users open; plain HTTP redirects to it.
            - OE_HTTPS_PORT=10443
        command:
            - /bin/sh
            - -c
            - "envsubst '$$OE_HTTPS_PORT' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"
        volumes:
            - type: volume
              source: certs-vol
              target: /etc/nginx/certs/
              volume:
                nocopy: true
            - type: volume
              source: keys-vol
              target: /etc/nginx/keys/
              volume:
                nocopy: true
            - ./volume/nginx/nginx-prod.conf:/etc/nginx/nginx.conf.template:ro
        networks:
            - default
        restart: unless-stopped
        depends_on:
            certs:
                condition: service_completed_successfully

secrets:
    initial-admin-password:
        # In the OpenELIS-Global-2 checkout; the test admin password (adminADMIN!).
        file: ./dev/initial-admin-password
    common.properties:
        file: ./volume/properties/common.properties

networks:
    default:
        driver: bridge
        ipam:
            config:
                - subnet: 172.22.1.0/24

volumes:
    db-data:
    key_trust-store-volume:
    certs-vol:
    keys-vol:
    reporting-data:
    modules-data:
