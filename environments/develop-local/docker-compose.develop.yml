# ---------------------------------------------------------------------------
# RUN THIS FROM AN OpenELIS-Global-2 CHECKOUT, NOT FROM THIS DIRECTORY.
#
# The service definitions mount ./volume/... paths (database.env, nginx conf,
# properties, plugins, lucene) that exist in the application repo, not in the
# QA repo. `docker compose config` run from here fails with
# "env file .../environments/develop-local/volume/database/database.env not
# found" — that is this, not a broken file.
#
#   git clone --depth 1 --branch develop \
#     https://github.com/DIGI-UW/OpenELIS-Global-2.git ~/dev/oe-develop-qa
#   mkdir -p ~/dev/oe-develop-qa/volume/plugins ~/dev/oe-develop-qa/volume/lucene
#   cp environments/develop-local/docker-compose.develop.yml ~/dev/oe-develop-qa/
#   cd ~/dev/oe-develop-qa
#   docker compose -p oedevqa -f docker-compose.develop.yml up -d
#
# The copy here is the version of record, so the stack is reproducible from
# this repo rather than from one laptop. See ../README.md.
# ---------------------------------------------------------------------------
# OpenELIS Global DEVELOP — local QA target
#
# Generated 2026-09-10 from ../oe-322-qa/docker-compose.qa.yml, which pins
# 3.2.2.0. This one pins `:develop` on purpose.
#
# WHY BOTH EXIST. The QA suite was written and verified against the 3.2.2.0
# release images, but the client bug reports are coming from the develop
# branch. A suite that only ever runs against a three-week-old release build
# cannot see a develop regression. Running both means a failure can be
# attributed: red on develop and green on 3.2.2.0 is a new regression, red on
# both is an older bug the suite had not yet covered.
#
# `:develop` is a moving target by design. Record the image digest with the run
# if you need to reproduce a result:
#   docker inspect openelisglobal-webapp-dev --format '{{index .Image}}'
#
# Everything that could collide with the two stacks already running is moved —
# project name, container names, host ports, network subnet, and the named
# volumes (project-scoped, which is what keeps the 3.2.2.0 database intact):
#
#   distro stack    proxy 80/443       webapp 8080/8443    fhir 8081/8444    db 15432   subnet 172.20.1.0/24
#   3.2.2.0 stack   proxy 9080/9443    webapp 18080/18443  fhir 18081/18444  db 15433   subnet 172.21.1.0/24
#   develop stack   proxy 10080/10443  webapp 19080/19443  fhir 19081/19444  db 15434   subnet 172.22.1.0/24
#
# Bring it up with an explicit project name so the volumes stay separate:
#   docker compose -p oedevqa -f docker-compose.develop.yml up -d
#
# Reach it at https://localhost:10443 (through the nginx proxy — NOT
# https://localhost:19443, which is Tomcat direct and serves the legacy JSP app
# rather than the React front end).
#
# A cold first boot reseeds the whole config catalog (~836s measured on this
# host), which is why the webapp healthcheck carries a 900s start_period.
services:
    certs:
        container_name: oe-certs-dev
        image: itechuw/certgen:main
        platform: linux/amd64
        restart: "no"
        environment:
            - KEYSTORE_PW="kspass"
            - TRUSTSTORE_PW="tspass"
        networks:
            - default
        volumes:
            - key_trust-store-volume:/etc/openelis-global
            - keys-vol:/etc/ssl/private/
            - certs-vol:/etc/ssl/certs/

    db.openelis.org:
        container_name: openelisglobal-database-dev
        image: itechuw/openelis-global-2-database:develop
        platform: linux/amd64
        ports:
            - "15434:5432"
        restart: always
        env_file:
            - ./volume/database/database.env
        environment:
            - DB_PASSWORD=${OE_DB_PASSWORD:-clinlims}
            - DB_SUPERUSER_PASSWORD=${ADMIN_PASSWORD:-superuser}
        volumes:
            # Named volume, project-scoped, so this database is entirely
            # separate from the distro stack's bind-mounted one.
            - db-data:/var/lib/postgresql/data
        networks:
            - default
        healthcheck:
            test: [ "CMD", "pg_isready", "-q", "-d", "clinlims", "-U", "clinlims" ]
            timeout: 45s
            interval: 10s
            retries: 10

    oe.openelis.org:
        container_name: openelisglobal-webapp-dev
        image: itechuw/openelis-global-2:develop
        platform: linux/amd64
        depends_on:
            - db.openelis.org
            - certs
        ports:
            - "19080:8080"
            - "19443:8443"
        restart: always
        networks:
            default:
                ipv4_address: 172.22.1.121
        healthcheck:
            test: ["CMD-SHELL", "curl -k -sf https://localhost:8443/OpenELIS-Global/health > /dev/null"]
            interval: 15s
            timeout: 15s
            retries: 10
            start_period: 900s
        environment:
            - DEFAULT_PW=adminADMIN!
            - TZ=${TZ:-UTC}
            - CATALINA_OPTS=-Ddatasource.url=jdbc:postgresql://db.openelis.org:5432/clinlims -Ddatasource.username=clinlims -Ddatasource.password=${OE_DB_PASSWORD:-clinlims} -Doe.ssl.truststorepath=${SSL_TRUSTSTORE_PATH:-/etc/openelis-global/truststore} -Doe.ssl.truststorepassword=${SSL_TRUSTSTORE_PASSWORD:-tspass} -Doe.ssl.keystorepath=${SSL_KEYSTORE_PATH:-/etc/openelis-global/keystore} -Doe.ssl.keystorepassword=${SSL_KEYSTORE_PASSWORD:-kspass}
        volumes:
            - key_trust-store-volume:/etc/openelis-global
            - ./volume/plugins/:/var/lib/openelis-global/plugins
            - ./volume/lucene:/var/lib/lucene_index
            - ./volume/analyzer/analyzer-test-map.csv:/var/lib/openelis-global/analyzer/analyzer-test-map.csv
            - ./volume/properties/SystemConfiguration.properties:/var/lib/openelis-global/properties/SystemConfiguration.properties
            - ./volume/odoo/odoo-test-product-mapping.csv:/var/lib/openelis-global/odoo/odoo-test-product-mapping.csv
            - ./volume/configuration:/var/lib/openelis-global/configuration
        secrets:
            - source: common.properties

    fhir.openelis.org:
        container_name: external-fhir-api-dev
        image: itechuw/openelis-global-2-fhir:develop
        platform: linux/amd64
        depends_on:
            - db.openelis.org
            - certs
        ports:
            - "19081:8080"
            - "19444:8443"
        networks:
            - default
        restart: always
        environment:
            TZ: ${TZ:-UTC}
            JAVA_OPTS: "-Djavax.net.ssl.trustStore=${SSL_TRUSTSTORE_PATH:-/etc/openelis-global/truststore}
                        -Djavax.net.ssl.trustStorePassword=${SSL_TRUSTSTORE_PASSWORD:-tspass}
                        -Djavax.net.ssl.trustStoreType=pkcs12
                        -Djavax.net.ssl.keyStore=${SSL_KEYSTORE_PATH:-/etc/openelis-global/keystore}
                        -Djavax.net.ssl.keyStorePassword=${SSL_KEYSTORE_PASSWORD:-kspass}
                        -Djavax.net.ssl.keyStoreType=pkcs12"
            CATALINA_OPTS: "-Dhapi.ssl.truststorepath=${SSL_TRUSTSTORE_PATH:-/etc/openelis-global/truststore} -Dhapi.ssl.truststorepassword=${SSL_TRUSTSTORE_PASSWORD:-tspass} -Dhapi.ssl.keystorepath=${SSL_KEYSTORE_PATH:-/etc/openelis-global/keystore} -Dhapi.ssl.keystorepassword=${SSL_KEYSTORE_PASSWORD:-kspass}"
            FHIR_DATASOURCE_URL: "jdbc:postgresql://db.openelis.org:5432/clinlims?currentSchema=clinlims"
            FHIR_DATASOURCE_USERNAME: "clinlims"
            FHIR_DATASOURCE_PASSWORD: ${OE_DB_PASSWORD:-clinlims}
            FHIR_SERVER_ADRESS: "http://fhir.openelis.org:8080/fhir/"
        volumes:
            - key_trust-store-volume:/etc/openelis-global

    frontend.openelis.org:
        image: itechuw/openelis-global-2-frontend:develop
        container_name: openelisglobal-front-end-dev
        platform: linux/amd64
        networks:
            - default
        environment:
            - CHOKIDAR_USEPOLLING=true
        tty: true

    proxy:
        image: itechuw/openelis-global-2-proxy:develop
        container_name: openelisglobal-proxy-dev
        platform: linux/amd64
        ports:
            - 10080:80
            - 10443:443
        volumes:
            - certs-vol:/etc/nginx/certs/
            - keys-vol:/etc/nginx/keys/
            - ./volume/nginx/nginx-prod.conf:/etc/nginx/nginx.conf:ro
        networks:
            - default
        restart: unless-stopped
        depends_on:
            - certs

secrets:
    common.properties:
        file: ./volume/properties/common.properties

networks:
    default:
        driver: bridge
        ipam:
            config:
                - subnet: 172.22.1.0/24

volumes:
    db-data:
    key_trust-store-volume:
    certs-vol:
    keys-vol:
